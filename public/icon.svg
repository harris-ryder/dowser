<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E4F45"/>
      <stop offset="1" stop-color="#1B8A6B"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#E8A93A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- signal arcs above the coin -->
  <path d="M196 318 A60 60 0 0 1 316 318" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>
  <path d="M166 300 A90 90 0 0 1 346 300" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="10" stroke-linecap="round"/>
  <!-- dowsing rod: two handles up, stem pointing down at the coin -->
  <path d="M158 104 L256 216 L354 104" fill="none" stroke="#F5C24B" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 216 L256 336" fill="none" stroke="#F5C24B" stroke-width="34" stroke-linecap="round"/>
  <!-- coin -->
  <circle cx="256" cy="400" r="58" fill="url(#coin)"/>
  <circle cx="256" cy="400" r="40" fill="none" stroke="#B9791A" stroke-opacity="0.55" stroke-width="8"/>
</svg>
